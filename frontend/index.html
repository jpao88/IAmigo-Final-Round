<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ef">
  <title>IAmigo</title>
  <script>
    // Aplica o modo escolhido antes de desenhar, para a tela não piscar (ver js/tema.js).
    try {
      var tema = localStorage.getItem("iamigo-tema");
      if (tema === "claro" || tema === "escuro") document.documentElement.dataset.tema = tema;
    } catch (erro) {}
  </script>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <main id="app" class="tela" aria-live="polite"></main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
